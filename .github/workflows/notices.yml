name: 공지 반영 (issues → site)

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: notices
  cancel-in-progress: true

jobs:
  build:
    # 라벨 '공지' 가 있는 이슈이거나 수동 실행일 때만
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, '공지') || github.event.action == 'unlabeled' || github.event.action == 'deleted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown requests
      - name: Rebuild notice lists and pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_notices.py
      - name: Commit and push
        run: |
          git config user.name "jscc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "공지 반영: ${{ github.event.issue.title || 'manual' }}" && git push; fi
